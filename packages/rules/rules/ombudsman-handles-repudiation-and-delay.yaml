id: ombudsman-handles-repudiation-and-delay
title: The Ombudsman handles full or partial claim rejection and late settlement
summary: >-
  The Insurance Ombudsman can hear complaints about a health insurer rejecting a claim fully or partly, and about a
  claim not being settled within the time the regulations allow.
applies_to: [all]
forum: insurance_ombudsman
type: eligibility
source_reference: "Rule 13(1)(a) and Rule 13(1)(b)"
source_url: "https://www.cioins.co.in/notification/Insurance%20Ombudsman%20Rules,%202017(%20as%20amended%20till%2009.11.2023).pdf"
source_title: "The Insurance Ombudsman Rules, 2017 (as amended till 09.11.2023), consolidated text published by the Council for Insurance Ombudsmen"
issuing_body: "Ministry of Finance, Department of Financial Services (Government of India)"
date_checked: 2026-11-06
status: draft
