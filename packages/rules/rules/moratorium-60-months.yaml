id: moratorium-60-months
title: After 60 months of continuous cover, claims cannot be contested for non-disclosure except fraud
summary: >-
  Once a health policy has been in force continuously for 60 months (the moratorium period), the insurer cannot
  contest the policy or a claim on the ground of non-disclosure or misrepresentation, except where fraud is
  established. Continuous cover from ported or migrated policies counts toward the 60 months.
applies_to: [non_disclosure, pre_existing_disease]
forum: any
type: right
parameters:
  moratorium:
    value: 60
    unit: months
    counted_from: start of continuous coverage (including ported or migrated policy credits)
source_reference: "Chapter I, para 13 (Moratorium Period)"
notes: >-
  Text read from a mirror copy (caalley.com) because the official file URL could not be fetched (URL too long for the fetch tool); confirm the paragraph against the official PDF at source_url. Circular reference read as IRDAI/HLT/CIR/PRO/84/5/2024; confirm. Whether this also limits pre-existing-disease exclusions (as opposed to non-disclosure) should be
  confirmed from the exact wording before relying on it for the pre_existing_disease reason code.
