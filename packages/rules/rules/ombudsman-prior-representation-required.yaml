id: ombudsman-prior-representation-required
title: Complain to the insurer in writing before going to the Ombudsman
summary: >-
  The Insurance Ombudsman accepts a complaint only if you first complained to the insurer in writing or by email, and
  the insurer rejected it, did not reply within one month, or replied in a way you are not satisfied with. The
  Ombudsman will not take a complaint on the same matter if it is pending before, or already decided by, a court,
  consumer forum or arbitrator.
applies_to: [all]
forum: insurance_ombudsman
type: eligibility
source_reference: "Rule 14(3)(a) and Rule 14(5)"
source_url: "https://www.cioins.co.in/notification/Insurance%20Ombudsman%20Rules,%202017(%20as%20amended%20till%2009.11.2023).pdf"
source_title: "The Insurance Ombudsman Rules, 2017 (as amended till 09.11.2023), consolidated text published by the Council for Insurance Ombudsmen"
issuing_body: "Ministry of Finance, Department of Financial Services (Government of India)"
