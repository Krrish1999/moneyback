id: repudiation-needs-committee-approval-and-reasons
title: A claim may be rejected only with committee approval, and the reasons must cite the policy terms
summary: >-
  A health insurer may not reject a claim without the approval of its claims review committee (the PMC or a
  three-member sub-group of it). When a claim is rejected or only partly paid, the insurer must tell the claimant the
  full details, referring to the specific policy terms and conditions.
applies_to: [all]
forum: insurer_gro
type: duty
source_reference: "Chapter I, para 17(a) and para 17(b); Chapter II A.I(4)(b) (Claims Review Committee)"
notes: >-
  Text read from a mirror copy (caalley.com) because the official file URL could not be fetched (URL too long for the fetch tool); confirm the paragraph against the official PDF at source_url. Circular reference read as IRDAI/HLT/CIR/PRO/84/5/2024; confirm. The PPHI master circular 2024 (Part B) has a similar requirement to give full details with reference to
  the policy terms.
