name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No `version:` input: pnpm/action-setup reads it from the root package.json `packageManager` field.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      # Deterministic: scores recorded model outputs only, no live model calls.
      - name: Eval (recorded outputs)
        run: pnpm eval

      - name: Build web app
        run: pnpm --filter @moneyback/web build

      - name: Install Playwright Chromium
        run: pnpm --filter @moneyback/e2e exec playwright install --with-deps chromium

      # The Playwright webServer builds and serves the web app on :4173 (vite preview).
      - name: End-to-end tests
        run: pnpm e2e
        env:
          CI: "true"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
